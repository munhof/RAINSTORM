[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rainstorm-vame-worker"
version = "0.1.0"
description = "Isolated STORM worker for RAINSTORM native and official VAME adapters."
requires-python = ">=3.12,<3.13"
dependencies = [
    "rainstorm-thesis[vame_native,vame_official]",
    "storm-studio==0.1.0a0",
    "torch>=2.11.0",
]

[tool.uv]
environments = ["sys_platform == 'linux'"]
required-version = "==0.11.8"
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
rainstorm-thesis = { path = "../../packages/rainstorm-thesis", editable = true }
storm-studio = { path = "../../../STORM-System-for-Traceable-Orchestration-Reuse-and-Modeling/packages/storm-studio" }
storm-traceable = { path = "../../../STORM-System-for-Traceable-Orchestration-Reuse-and-Modeling/packages/storm-engine", editable = true }
torch = { index = "pytorch-cpu" }
