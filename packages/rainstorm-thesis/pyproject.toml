[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rainstorm-thesis"
version = "0.1.0"
description = "RAINSTORM thesis-domain adapters and STORM notebooks"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.25",
    "pandas>=2.0",
    "PyYAML>=6.0",
    "scipy>=1.10",
    "storm-traceable",
    "tables>=3.9",
]

[project.optional-dependencies]
vame = [
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
]
vame_native = [
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
]
vame_official = [
    "vame-py==0.14.4; python_version >= '3.12' and sys_platform != 'win32'",
]
kpms_native = ["scikit-learn>=1.5", "tqdm>=4.67"]
kpms_official = ["keypoint-moseq==0.6.8; python_version < '3.13'", "numpy<2"]
kpms = [
    "matplotlib>=3.8",
    "scikit-learn>=1.5",
]
notebooks = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
test = [
    "pytest>=8",
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["rainstorm_thesis"]

[tool.pytest.ini_options]
testpaths = ["../../tests"]

[tool.uv.sources]
storm-traceable = { path = "../../../STORM-System-for-Traceable-Orchestration-Reuse-and-Modeling/packages/storm-engine", editable = true }

[tool.setuptools.package-data]
rainstorm_thesis = ["THESIS_LICENSE"]
