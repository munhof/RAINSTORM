[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rainstorm"
version = "1.0.12"
description = "Real & Artificial Intelligence for Neuroscience - Simple Tracker for Object Recognition Memory"
readme = "README.md"
requires-python = ">=3.9,<3.10"
license = "MIT"
authors = [
    { name = "Santiago D'hers", email = "sdhers@fbmc.fcen.uba.ar" },
]
classifiers = [
    "Programming Language :: Python :: 3.9",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.25.2,<2.0",
    "pandas>=2.0.3,<2.2.0",
    "PyYAML>=6.0",
    "scipy>=1.10.0,<1.14.0",
]

[project.optional-dependencies]
ui = [
    "customtkinter>=5.2.0",
    "keyboard>=0.13.5",
    "opencv-python>=4.10.0",
    "plotly>=5.24.0",
    "ruamel.yaml>=0.17.0",
    "seaborn>=0.13.0",
    "tables>=3.9.0",
    "tqdm>=4.67.0",
]
supervised = [
    "h5py>=3.10,<4.0",
    "keras==2.10.0",
    "scikit-learn>=1.5.0",
    "tensorflow==2.10.1",
]
notebooks = [
    "ipykernel>=6",
    "jupyterlab>=4",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
]
test = [
    "pytest>=8",
]
all = [
    "customtkinter>=5.2.0",
    "h5py>=3.10,<4.0",
    "ipykernel>=6",
    "jupyterlab>=4",
    "keyboard>=0.13.5",
    "keras==2.10.0",
    "matplotlib>=3.9.0",
    "opencv-python>=4.10.0",
    "plotly>=5.24.0",
    "pytest>=8",
    "ruamel.yaml>=0.17.0",
    "scikit-learn>=1.5.0",
    "seaborn>=0.13.0",
    "tables>=3.9.0",
    "tensorflow==2.10.1",
    "tqdm>=4.67.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["rainstorm*"]

[tool.setuptools.package-data]
"rainstorm.backend.prepare_positions.params_gui.help_text" = ["*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
